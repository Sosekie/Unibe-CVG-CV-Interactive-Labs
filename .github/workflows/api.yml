# Tests the course API in api/ and deploys it to Cloudflare Workers with its D1
# database. Needs the repository secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID; GH_OAUTH_CLIENT_ID and GH_OAUTH_CLIENT_SECRET enable
# teacher sign-in. Without the Cloudflare secrets the API is only tested.
name: Deploy course API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "tutorial-*/lib/question-bank.ts"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npx wrangler types && npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Check the Cloudflare secrets
        id: cloudflare
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing, so the API was tested but not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Find or create the D1 database
        if: steps.cloudflare.outputs.ready == 'true'
        run: node scripts/write-ci-config.mjs
      - name: Apply database migrations
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply cv-labs --remote --config wrangler.ci.json
      - name: Deploy the Worker
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
        run: |
          node -e "const s = {}; if (process.env.GH_OAUTH_CLIENT_ID) s.GITHUB_CLIENT_ID = process.env.GH_OAUTH_CLIENT_ID; if (process.env.GH_OAUTH_CLIENT_SECRET) s.GITHUB_CLIENT_SECRET = process.env.GH_OAUTH_CLIENT_SECRET; require('fs').writeFileSync('secrets.json', JSON.stringify(s));"
          npx wrangler deploy --config wrangler.ci.json --secrets-file secrets.json
          rm -f secrets.json
