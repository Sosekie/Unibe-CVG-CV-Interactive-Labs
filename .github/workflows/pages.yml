# Publishes the course site to GitHub Pages:
#   site/                     -> https://sosekie.github.io/Unibe-CVG-CV-Interactive-Labs/
#   tutorial-NN-<name>/ (lab) -> https://sosekie.github.io/Unibe-CVG-CV-Interactive-Labs/tutorial-NN/
# Every lab folder is tested, built as a static export and copied into the site.
# Requires Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Publish course site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tutorial-*/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a running deployment is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tutorial-*/package-lock.json
      - name: Test and build the labs
        env:
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r site/. _site/
          for lab in tutorial-*/; do
            lab="${lab%/}"
            slug="${lab:0:11}"
            echo "::group::$slug ($lab)"
            npm --prefix "$lab" ci
            (cd "$lab" && LABS_BASE_PATH="/$REPOSITORY/$slug" npm test)
            (cd "$lab" && LABS_BASE_PATH="/$REPOSITORY/$slug" npm run build)
            cp -r "$lab/out" "_site/$slug"
            echo "::endgroup::"
          done
      - name: Set up Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
